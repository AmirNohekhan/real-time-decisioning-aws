[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-time-decisioning-aws"
version = "0.1.0"
description = "Local-first multi-stage real-time recommendation and decisioning platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "numpy>=1.26,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "joblib>=1.4,<2",
  "structlog>=24.2,<26", "boto3>=1.35,<2"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "bandit>=1.7,<2", "pip-audit>=2.7,<3"]

[project.scripts]
decision-platform = "decision_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["decision_platform"]
[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "scipy.*", "boto3.*", "pandas.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
